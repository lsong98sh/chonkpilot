<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChonkPilot</title>
  <!-- 主题资产（THEME-1）：语义别名 → /themes.css（宿主 <exeDir>/themes/themes.css，缺失回落内置）。
       必须是同步经典脚本、且早于任何样式与 /src/main.js —— 首帧前落实 data-theme，避免闪白。 -->
  <link rel="stylesheet" href="/shared/ck-theme.css" />
  <link rel="stylesheet" href="/themes.css" />
  <script src="/shared/ck-theme.js"></script>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
    #app { height: 100%; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
