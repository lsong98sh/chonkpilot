<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>代码知识库</title>
  <link rel="stylesheet" href="/shared/ck-theme.css" />
  <link rel="stylesheet" href="/themes.css" />
  <script src="/shared/ck-theme.js"></script>
  <!-- 受控 mq 入口（PLUGIN-UI-1）：宿主在 iframe load 后注入 on/off/emit，插件页直接用 ckMq。 -->
  <script src="/shared/ck-mq.js"></script>
  <style>
    body { margin: 0; padding: 16px 18px; font: 13px/1.5 var(--ck-font-sans); color: var(--ck-text); background: var(--ck-bg); }
    h1 { font-size: 16px; margin: 0 0 4px; }
    h2 { font-size: 13px; margin: 0 0 10px; }
    p.sub { margin: 0 0 16px; color: var(--ck-text-muted); font-size: 12px; }
    .card { border: 1px solid var(--ck-border); border-radius: 8px; padding: 14px; margin-bottom: 14px; }
    .row { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    label { font-weight: 600; font-size: 12px; }
    input[type=text] { width: 100%; box-sizing: border-box; padding: 7px 9px; border: 1px solid var(--ck-border); border-radius: 6px; font: inherit; background: transparent; color: inherit; }
    .inline { display: flex; align-items: center; gap: 8px; }
    .hint { color: var(--ck-text-muted); font-size: 11px; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    button { padding: 6px 12px; border-radius: 6px; border: 1px solid var(--ck-border); background: var(--ck-surface); color: inherit; font: inherit; cursor: pointer; }
    button.primary { background: var(--ck-accent); border-color: var(--ck-accent); color: var(--ck-accent-fg); }
    button:disabled { opacity: .55; cursor: default; }
    pre { margin: 10px 0 0; padding: 10px; max-height: 220px; overflow: auto; border-radius: 6px; background: var(--ck-surface); font-size: 11px; }
    .msg { font-size: 12px; white-space: pre-wrap; margin-top: 8px; }
    .msg.err { color: var(--ck-danger); }
    .msg.ok { color: var(--ck-success); }
    .kv { color: var(--ck-text-muted); font-size: 11px; }
  </style>
</head>
<body>
  <h1>代码知识库</h1>
  <p class="sub">codegraph（符号/调用/依赖）与 vfts（全文检索）共用同一工作区配置。配置统一存于项目配置（<code>plugins.codebase.*</code>），保存即下发引擎。</p>

  <div class="card">
    <h2>工作区</h2>
    <div class="row">
      <label>项目根目录（绝对路径）</label>
      <input type="text" id="workdir" placeholder="例如 E:\\BizWorks\\chonkpilot" autocomplete="off" />
      <div class="hint">索引产物落在 &lt;workdir&gt;/.chonkpilot 下；两个引擎共用该根目录。</div>
    </div>
    <div class="actions">
      <button class="primary" id="loadStatus">读取状态</button>
      <button id="indexNow">立即索引</button>
    </div>
    <div class="kv" id="scopeInfo"></div>
  </div>

  <div class="card">
    <h2>符号图谱（codegraph）</h2>
    <div class="inline" style="margin-bottom:10px">
      <input type="checkbox" id="cgEnabled" />
      <span class="hint">启用 codegraph（关闭后查询工具不注册）</span>
    </div>
    <div class="grid">
      <div class="row">
        <label>索引扩展名</label>
        <input type="text" id="cgExts" placeholder=".go,.ts,.py（空 = 默认语言集）" autocomplete="off" />
      </div>
      <div class="row">
        <label>排除目录</label>
        <input type="text" id="cgSkip" placeholder="node_modules,dist" autocomplete="off" />
      </div>
    </div>
    <div class="inline" style="margin-bottom:12px">
      <input type="checkbox" id="cgGitignore" />
      <span class="hint">叠加 .gitignore</span>
    </div>
    <div class="actions">
      <button class="primary" id="cgSave">保存并应用</button>
      <button id="cgClear">清除索引</button>
    </div>
  </div>

  <div class="card">
    <h2>全文检索（vfts）</h2>
    <div class="inline" style="margin-bottom:10px">
      <input type="checkbox" id="vfEnabled" />
      <span class="hint">启用 vfts（关闭后查询工具不注册）</span>
    </div>
    <div class="grid">
      <div class="row">
        <label>索引扩展名</label>
        <input type="text" id="vfExts" placeholder=".txt,.md,.go（空 = 默认）" autocomplete="off" />
      </div>
      <div class="row">
        <label>排除目录</label>
        <input type="text" id="vfSkip" placeholder="node_modules,dist" autocomplete="off" />
      </div>
    </div>
    <div class="inline" style="margin-bottom:6px">
      <input type="checkbox" id="vfGitignore" />
      <span class="hint">叠加 .gitignore</span>
    </div>
    <div class="inline" style="margin-bottom:6px">
      <input type="checkbox" id="vfDocs" />
      <span class="hint">索引 Office / PDF（需文档转换服务）</span>
    </div>
    <div class="row" style="max-width:220px">
      <label>文档单文件上限（MB）</label>
      <input type="text" id="vfDocMaxMB" placeholder="50（1–4096）" autocomplete="off" />
    </div>
    <div class="actions">
      <button class="primary" id="vfSave">保存并应用</button>
      <button id="vfStatus">引擎状态</button>
    </div>
  </div>

  <div id="msg" class="msg"></div>
  <pre id="out" hidden></pre>

  <script src="/plugin-ui/_sdk/plugin.js"></script>
  <script>
    const KEY_CG_ENABLED = 'plugins.codebase.codegraph.enabled';
    const KEY_CG_EXTS = 'plugins.codebase.codegraph.exts';
    const KEY_CG_SKIP = 'plugins.codebase.codegraph.skip-dirs';
    const KEY_CG_STACK = 'plugins.codebase.codegraph.stack-gitignore';
    const KEY_VF_ENABLED = 'plugins.codebase.vfts.enabled';
    const KEY_VF_EXTS = 'plugins.codebase.vfts.exts';
    const KEY_VF_SKIP = 'plugins.codebase.vfts.skip-dirs';
    const KEY_VF_STACK = 'plugins.codebase.vfts.stack-gitignore';
    const KEY_VF_DOCS = 'plugins.codebase.vfts.docs';
    const KEY_VF_DOC_MB = 'plugins.codebase.vfts.doc-max-mb';

    const msg = document.getElementById('msg');
    const out = document.getElementById('out');

    function show(text, err) {
      msg.textContent = text || '';
      msg.className = 'msg ' + (text ? (err ? 'err' : 'ok') : '');
    }
    function dump(v) {
      out.hidden = false;
      out.textContent = typeof v === 'string' ? v : JSON.stringify(v, null, 2);
    }
    function bool(v) {
      return v === 'true';
    }
    function workdir() {
      const v = document.getElementById('workdir').value.trim();
      if (!v) throw new Error('请先填写项目根目录');
      return v;
    }
    async function callTool(name, args) {
      const r = await ckPlugin.call('rpc', { method: 'tool.call', params: { name, args } });
      const v = r && Object.prototype.hasOwnProperty.call(r, 'result') ? r.result : r;
      dump(v);
      return v;
    }
    /**
     * 插件动作面（PLUGIN-UI-1）：`POST /plugins/codebase/api/<action>`，请求头带来源插件 id。
     * 配置**只**经此通道写（服务端校验并落 prj 配置 → 下发引擎），页面不再直调引擎 configure。
     */
    async function api(action, payload) {
      const res = await fetch('/plugins/codebase/api/' + encodeURIComponent(action), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-CK-Plugin-Id': 'codebase' },
        body: JSON.stringify(payload || {}),
      });
      let body = null;
      try { body = await res.json(); } catch (_) { /* 非 JSON 响应体：按状态码报错 */ }
      if (!res.ok) {
        const errors = (body && Array.isArray(body.errors) && body.errors) || ['HTTP ' + res.status];
        throw new Error(errors.join('; '));
      }
      return body;
    }

    function fill(values) {
      document.getElementById('cgEnabled').checked = bool(values[KEY_CG_ENABLED]);
      document.getElementById('cgExts').value = values[KEY_CG_EXTS] || '';
      document.getElementById('cgSkip').value = values[KEY_CG_SKIP] || '';
      document.getElementById('cgGitignore').checked = bool(values[KEY_CG_STACK]);
      document.getElementById('vfEnabled').checked = bool(values[KEY_VF_ENABLED]);
      document.getElementById('vfExts').value = values[KEY_VF_EXTS] || '';
      document.getElementById('vfSkip').value = values[KEY_VF_SKIP] || '';
      document.getElementById('vfGitignore').checked = bool(values[KEY_VF_STACK]);
      document.getElementById('vfDocs').checked = bool(values[KEY_VF_DOCS]);
      document.getElementById('vfDocMaxMB').value = values[KEY_VF_DOC_MB] || '';
    }

    /** 读取有效配置（缺键 = 插件内置默认）。 */
    async function loadConfig(silent) {
      try {
        const r = await api('load', { workdir: document.getElementById('workdir').value.trim() });
        fill(r.values || {});
        if (!document.getElementById('workdir').value.trim() && r.workdir) {
          document.getElementById('workdir').value = r.workdir;
        }
        document.getElementById('scopeInfo').textContent =
          '实例：' + (r.instance_id || '—') + '　已配置键：' + ((r.explicit || []).length) + ' 项';
        if (!silent) show('配置已读取。');
      } catch (e) {
        show('读取配置失败：' + e.message, true);
      }
    }

    /** 保存一份配置：校验由插件完成（非法值 → 明确错误，不静默截断）。 */
    async function save(entries) {
      const r = await api('save', {
        workdir: workdir(),
        entries,
      });
      const applied = (r.applied || []).join('、') || '无（引擎均未启用）';
      show('已保存并下发：' + applied);
      return r;
    }

    document.getElementById('loadStatus').onclick = async () => {
      try {
        await callTool('codegraph_status', { workdir: workdir() });
        await callTool('vfts_status', { workdir: workdir() });
        show('已刷新状态。');
      } catch (e) { show('读取失败: ' + e.message, true); }
    };

    document.getElementById('indexNow').onclick = async () => {
      show('索引中…（大项目可能耗时较久）');
      try {
        await callTool('codegraph_initialize', { workdir: workdir() });
        await callTool('vfts_index', { workdir: workdir() });
        show('索引完成。');
      } catch (e) { show('索引失败: ' + e.message, true); }
    };

    document.getElementById('cgSave').onclick = async () => {
      try {
        await save({
          [KEY_CG_ENABLED]: document.getElementById('cgEnabled').checked ? 'true' : 'false',
          [KEY_CG_EXTS]: document.getElementById('cgExts').value.trim(),
          [KEY_CG_SKIP]: document.getElementById('cgSkip').value.trim(),
          [KEY_CG_STACK]: document.getElementById('cgGitignore').checked ? 'true' : 'false',
        });
      } catch (e) { show('保存失败: ' + e.message, true); }
    };

    document.getElementById('cgClear').onclick = async () => {
      try {
        // 维护动作同样经插件动作面（页面不直调引擎管理工具）。
        await api('clear', { workdir: workdir() });
        show('codegraph 索引已清除。');
      } catch (e) { show('清除失败: ' + e.message, true); }
    };

    document.getElementById('vfSave').onclick = async () => {
      try {
        await save({
          [KEY_VF_ENABLED]: document.getElementById('vfEnabled').checked ? 'true' : 'false',
          [KEY_VF_EXTS]: document.getElementById('vfExts').value.trim(),
          [KEY_VF_SKIP]: document.getElementById('vfSkip').value.trim(),
          [KEY_VF_STACK]: document.getElementById('vfGitignore').checked ? 'true' : 'false',
          [KEY_VF_DOCS]: document.getElementById('vfDocs').checked ? 'true' : 'false',
          [KEY_VF_DOC_MB]: document.getElementById('vfDocMaxMB').value.trim(),
        });
      } catch (e) { show('保存失败: ' + e.message, true); }
    };

    document.getElementById('vfStatus').onclick = async () => {
      try {
        await callTool('vfts_status', { workdir: workdir() });
        show('已刷新。');
      } catch (e) { show('读取失败: ' + e.message, true); }
    };

    loadConfig(true);
  </script>
</body>
</html>
