<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>桌面操作</title>
  <link rel="stylesheet" href="/shared/ck-theme.css" />
  <link rel="stylesheet" href="/themes.css" />
  <script src="/shared/ck-theme.js"></script>
  <style>
    body { margin: 0; padding: 16px 18px; font: 13px/1.5 var(--ck-font-sans); color: var(--ck-text); background: var(--ck-bg); }
    h1 { font-size: 16px; margin: 0 0 4px; }
    h2 { font-size: 13px; margin: 0 0 10px; }
    p.sub { margin: 0 0 16px; color: var(--ck-text-muted); font-size: 12px; }
    .card { border: 1px solid var(--ck-border); border-radius: 8px; padding: 14px; margin-bottom: 14px; }
    .row { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
    label { font-weight: 600; font-size: 12px; }
    input[type=text] { width: 100%; box-sizing: border-box; padding: 7px 9px; border: 1px solid var(--ck-border); border-radius: 6px; font: inherit; background: transparent; color: inherit; }
    .hint { color: var(--ck-text-muted); font-size: 11px; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    button { padding: 6px 12px; border-radius: 6px; border: 1px solid var(--ck-border); background: var(--ck-surface); color: inherit; font: inherit; cursor: pointer; }
    button.primary { background: var(--ck-accent); border-color: var(--ck-accent); color: var(--ck-accent-fg); }
    pre { margin-top: 10px; padding: 10px; max-height: 240px; overflow: auto; border-radius: 6px; background: var(--ck-surface); font-size: 11px; }
    .msg { font-size: 12px; white-space: pre-wrap; margin-top: 8px; }
    .msg.err { color: var(--ck-danger); }
    .msg.ok { color: var(--ck-success); }
  </style>
</head>
<body>
  <h1>桌面操作（desktop_run）</h1>
  <p class="sub">插件只做桥接，实际桌面能力由同目录的 chonkpilot-desktop-plugin.exe（Win32/UIA）承载；缺失时按需拉起。</p>

  <div class="card">
    <h2>默认参数</h2>
    <div id="form"></div>
    <div class="actions">
      <button class="primary" id="save">保存</button>
      <button id="reset">恢复默认</button>
    </div>
  </div>

  <div class="card">
    <h2>运行状态</h2>
    <div class="actions">
      <button id="refresh">刷新状态</button>
      <button id="check">检查引擎</button>
      <button id="ctx">查看会话</button>
    </div>
    <div class="hint" id="dims" style="margin-top:10px"></div>
  </div>

  <div id="msg" class="msg"></div>
  <pre id="out" hidden></pre>

  <script src="/plugin-ui/_sdk/plugin.js"></script>
  <script>
    const form = document.getElementById('form');
    const msg = document.getElementById('msg');
    const out = document.getElementById('out');
    let fields = [];

    function show(t, err) { msg.textContent = t || ''; msg.className = 'msg ' + (t ? (err ? 'err' : 'ok') : ''); }
    function dump(v) { out.hidden = false; out.textContent = typeof v === 'string' ? v : JSON.stringify(v, null, 2); }
    async function rpc(method) {
      const r = await ckPlugin.call('rpc', { method, params: {} });
      return r && Object.prototype.hasOwnProperty.call(r, 'result') ? r.result : r;
    }
    /**
     * 插件动作面（PLUGIN-UI-1）：`POST /plugins/desktop/api/<action>`，请求头带来源插件 id。
     * 配置**只**经此通道读写/校验（页面不再直调 config.get / config.set / 宿主方法）。
     */
    async function api(action, payload) {
      const res = await fetch('/plugins/desktop/api/' + encodeURIComponent(action), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-CK-Plugin-Id': 'desktop' },
        body: JSON.stringify(payload || {}),
      });
      let body = null;
      try { body = await res.json(); } catch (_) { /* 非 JSON 响应体：按状态码报错 */ }
      if (!res.ok) {
        const errors = (body && Array.isArray(body.errors) && body.errors) || ['HTTP ' + res.status];
        throw new Error(errors.join('; '));
      }
      return body;
    }
    function render(fs, values) {
      fields = fs || [];
      form.innerHTML = '';
      for (const f of fields) {
        const wrap = document.createElement('div');
        wrap.className = 'row';
        const lab = document.createElement('label');
        lab.textContent = f.label || f.key;
        wrap.appendChild(lab);
        const input = document.createElement('input');
        input.type = 'text';
        input.id = 'f_' + f.key;
        input.value = values[f.key] == null ? '' : String(values[f.key]);
        input.autocomplete = 'off';
        wrap.appendChild(input);
        form.appendChild(wrap);
      }
    }
    function collect() {
      const res = {};
      for (const f of fields) {
        const el = document.getElementById('f_' + f.key);
        // 值原样交给插件校验（不在页面静默改值）。
        if (el) res[f.key] = String(el.value || '').trim();
      }
      return res;
    }
    async function load() {
      try {
        const r = await api('load');
        render(r.fields, r.values);
        await refresh();
      } catch (e) { show('加载失败: ' + e.message, true); }
    }
    async function refresh() {
      try {
        const v = await rpc('status');
        document.getElementById('dims').textContent =
          '引擎：' + (v && v.ok ? '就绪' : '不可用（' + ((v && v.error) || '未知') + '）') +
          ' · socket：' + ((v && v.socket) || '-') + ' · 活动会话：' + ((v && v.contexts) || 0);
        dump(v);
      } catch (e) { show('状态读取失败: ' + e.message, true); }
    }

    document.getElementById('save').onclick = async () => {
      try { await api('save', { entries: collect() }); show('已保存。'); await load(); }
      catch (e) { show('保存失败: ' + e.message, true); }
    };
    document.getElementById('reset').onclick = async () => {
      try { await api('reset'); await load(); show('已恢复默认。'); }
      catch (e) { show('恢复失败: ' + e.message, true); }
    };
    document.getElementById('refresh').onclick = refresh;
    document.getElementById('check').onclick = async () => {
      try { dump(await rpc('ping')); show('引擎已就绪。'); }
      catch (e) { show('引擎不可用: ' + e.message, true); }
    };
    document.getElementById('ctx').onclick = async () => {
      try { dump(await rpc('contexts')); show('当前会话见上方 JSON。'); }
      catch (e) { show('读取失败: ' + e.message, true); }
    };

    load();
  </script>
</body>
</html>
