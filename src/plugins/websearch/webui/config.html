<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>联网搜索</title>
  <link rel="stylesheet" href="/shared/ck-theme.css" />
  <link rel="stylesheet" href="/themes.css" />
  <script src="/shared/ck-theme.js"></script>
  <style>
    body { margin: 0; padding: 16px 18px; font: 13px/1.5 var(--ck-font-sans); color: var(--ck-text); background: var(--ck-bg); }
    h1 { font-size: 16px; margin: 0 0 4px; }
    p.sub { margin: 0 0 16px; color: var(--ck-text-muted); font-size: 12px; }
    .row { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
    label { font-weight: 600; font-size: 12px; }
    input[type=text], input[type=password], input[type=number] {
      width: 100%; box-sizing: border-box; padding: 7px 9px; border: 1px solid var(--ck-border); border-radius: 6px;
      font: inherit; background: transparent; color: inherit;
    }
    .inline { display: flex; align-items: center; gap: 8px; }
    .hint { color: var(--ck-text-muted); font-size: 11px; }
    .actions { display: flex; gap: 8px; margin-top: 18px; }
    button { padding: 7px 14px; border-radius: 6px; border: 1px solid var(--ck-border); background: var(--ck-surface); color: inherit; font: inherit; cursor: pointer; }
    button.primary { background: var(--ck-accent); border-color: var(--ck-accent); color: var(--ck-accent-fg); }
    button:disabled { opacity: .55; cursor: default; }
    .msg { margin-top: 12px; font-size: 12px; white-space: pre-wrap; }
    .msg.err { color: var(--ck-danger); }
    .msg.ok { color: var(--ck-success); }
    .sect { border-top: 1px solid var(--ck-border); margin-top: 18px; padding-top: 14px; }
  </style>
</head>
<body>
  <h1>联网能力</h1>
  <p class="sub">三个工具共用一个配置页：<b>web_search</b>（DeepSeek 检索）· <b>web_fetch</b>（抓取转文本）· <b>web_download</b>（下载到本地）。
    密钥仅保存在本机，配置页只显示掩码；LLM 每次调用可用参数覆盖下列默认值。</p>
  <div id="form"></div>
  <div class="actions">
    <button class="primary" id="save">保存</button>
    <button id="test">测试检索</button>
    <button id="reset">恢复默认</button>
  </div>
  <div id="dl" class="hint" style="margin-top:12px"></div>
  <div id="msg" class="msg"></div>

  <script src="/plugin-ui/_sdk/plugin.js"></script>
  <script>
    const form = document.getElementById('form');
    const msg = document.getElementById('msg');
    let fields = [];
    let original = {};

    function show(text, err) {
      msg.textContent = text || '';
      msg.className = 'msg ' + (text ? (err ? 'err' : 'ok') : '');
    }
    function isTrue(v) { return v === true || v === 'true'; }
    /**
     * 插件动作面（PLUGIN-UI-1）：`POST /plugins/websearch/api/<action>`，请求头带来源插件 id。
     * 配置**只**经此通道读写/校验（页面不再直调 config.get / config.set / 宿主方法）。
     */
    async function api(action, payload) {
      const res = await fetch('/plugins/websearch/api/' + encodeURIComponent(action), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-CK-Plugin-Id': 'websearch' },
        body: JSON.stringify(payload || {}),
      });
      let body = null;
      try { body = await res.json(); } catch (_) { /* 非 JSON 响应体：按状态码报错 */ }
      if (!res.ok) {
        const errors = (body && Array.isArray(body.errors) && body.errors) || ['HTTP ' + res.status];
        throw new Error(errors.join('; '));
      }
      return body;
    }

    function render(fieldsIn, values) {
      fields = fieldsIn || [];
      original = { ...(values || {}) };
      form.innerHTML = '';
      for (const f of fields) {
        const wrap = document.createElement('div');
        wrap.className = 'row';
        const lab = document.createElement('label');
        lab.textContent = f.label || f.key;
        wrap.appendChild(lab);
        let input;
        if (f.type === 'boolean') {
          const line = document.createElement('div');
          line.className = 'inline';
          input = document.createElement('input');
          input.type = 'checkbox';
          input.id = 'f_' + f.key;
          input.checked = isTrue(values[f.key]);
          const t = document.createElement('span');
          t.className = 'hint';
          t.textContent = '启用';
          line.appendChild(input);
          line.appendChild(t);
          wrap.appendChild(line);
        } else {
          input = document.createElement('input');
          input.type = f.secret ? 'password' : (f.type === 'integer' ? 'number' : 'text');
          input.id = 'f_' + f.key;
          input.value = values[f.key] == null ? '' : String(values[f.key]);
          if (f.min != null) input.min = f.min;
          if (f.max != null) input.max = f.max;
          input.autocomplete = 'off';
          wrap.appendChild(input);
        }
        if (f.secret) {
          const h = document.createElement('div');
          h.className = 'hint';
          h.textContent = '仅本机保存；留空/掩码 = 不修改。';
          wrap.appendChild(h);
        }
        form.appendChild(wrap);
      }
    }

    function collect() {
      const out = {};
      for (const f of fields) {
        const el = document.getElementById('f_' + f.key);
        if (!el) continue;
        // 值原样交给插件校验（空 / 越界 → 明确错误，不在页面静默改值）。
        if (f.type === 'boolean') out[f.key] = el.checked ? 'true' : 'false';
        else out[f.key] = String(el.value || '').trim();
      }
      return out;
    }

    async function loadDl() {
      try {
        const r = await ckPlugin.call('rpc', { method: 'download-dir', params: {} });
        const v = r && r.result ? r.result : r;
        const dl = document.getElementById('dl');
        dl.textContent = '生效下载目录：' + (v.dir || '-') +
          ' · 单文件上限 ' + v.maxMB + 'MB' +
          ' · 扩展名 ' + (v.exts || '不限') +
          ' · ' + (v.overwrite ? '同名覆盖' : '同名自动加序号');
      } catch (_) { /* 忽略：仅展示 */ }
    }

    async function load() {
      try {
        const r = await api('load');
        render(r.fields, r.values);
        await loadDl();
        show('');
      } catch (e) { show('加载配置失败: ' + e.message, true); }
    }

    document.getElementById('save').onclick = async () => {
      try {
        await api('save', { entries: collect() });
        await load();
        show('已保存，下一次调用生效。');
      } catch (e) { show('保存失败: ' + e.message, true); }
    };

    document.getElementById('test').onclick = async () => {
      show('测试中…');
      try {
        const r = await ckPlugin.call('rpc', { method: 'test', params: {} });
        const v = r && r.result ? r.result : r;
        if (v && v.ok) show('连接正常（' + v.ms + 'ms）' + (v.title ? '：' + v.title : ''));
        else show('连接失败：' + ((v && v.error) || '未知错误'), true);
      } catch (e) { show('测试失败: ' + e.message, true); }
    };

    document.getElementById('reset').onclick = async () => {
      try {
        await api('reset');
        await load();
        show('已恢复默认。');
      } catch (e) { show('恢复失败: ' + e.message, true); }
    };

    load();
  </script>
</body>
</html>
