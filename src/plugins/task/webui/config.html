<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>任务工具</title>
  <link rel="stylesheet" href="/shared/ck-theme.css" />
  <link rel="stylesheet" href="/themes.css" />
  <script src="/shared/ck-theme.js"></script>
  <style>
    body { margin: 0; padding: 16px 18px; font: 13px/1.5 var(--ck-font-sans); color: var(--ck-text); background: var(--ck-bg); }
    h1 { font-size: 16px; margin: 0 0 4px; } h2 { font-size: 13px; margin: 0 0 10px; }
    p.sub { margin: 0 0 16px; color: var(--ck-text-muted); font-size: 12px; }
    .card { border: 1px solid var(--ck-border); border-radius: 8px; padding: 14px; margin-bottom: 14px; }
    .row { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    label { font-weight: 600; font-size: 12px; }
    input[type=text], input[type=number] { width: 100%; box-sizing: border-box; padding: 7px 9px; border: 1px solid var(--ck-border); border-radius: 6px; font: inherit; background: transparent; color: inherit; }
    .hint { color: var(--ck-text-muted); font-size: 11px; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    button { padding: 6px 12px; border-radius: 6px; border: 1px solid var(--ck-border); background: var(--ck-surface); color: inherit; font: inherit; cursor: pointer; }
    button.primary { background: var(--ck-accent); border-color: var(--ck-accent); color: var(--ck-accent-fg); }
    pre { margin-top: 10px; padding: 10px; max-height: 220px; overflow: auto; border-radius: 6px; background: var(--ck-surface); font-size: 11px; }
    .msg { font-size: 12px; white-space: pre-wrap; margin-top: 8px; }
    .msg.err { color: var(--ck-danger); } .msg.ok { color: var(--ck-success); }
  </style>
</head>
<body>
  <h1>任务工具</h1>
  <p class="sub">四个工具：<b>task_run</b> 执行 · <b>task_llm</b> 单次 LLM · <b>task_status</b> 任务树 · <b>task_stop</b> 终止。此处为默认参数，LLM 调用可覆盖。</p>

  <div class="card">
    <h2>默认参数</h2>
    <div class="grid" id="form"></div>
    <div class="actions" style="margin-top:6px">
      <button class="primary" id="save">保存</button>
      <button id="reset">恢复默认</button>
      <button id="refresh">刷新信息</button>
    </div>
    <div class="hint" id="dims" style="margin-top:10px"></div>
  </div>

  <div id="msg" class="msg"></div>
  <pre id="out" hidden></pre>

  <script src="/plugin-ui/_sdk/plugin.js"></script>
  <script>
    const form = document.getElementById('form');
    const msg = document.getElementById('msg');
    const out = document.getElementById('out');
    let fields = [];
    function show(t, err) { msg.textContent = t || ''; msg.className = 'msg ' + (t ? (err ? 'err' : 'ok') : ''); }
    function isTrue(v) { return v === true || v === 'true'; }
    async function rpc(method) {
      const r = await ckPlugin.call('rpc', { method, params: {} });
      return r && Object.prototype.hasOwnProperty.call(r, 'result') ? r.result : r;
    }
    /**
     * 插件动作面（PLUGIN-UI-1）：`POST /plugins/task/api/<action>`，请求头带来源插件 id。
     * 配置**只**经此通道读写/校验（页面不再直调 config.get / config.set / 宿主方法）。
     */
    async function api(action, payload) {
      const res = await fetch('/plugins/task/api/' + encodeURIComponent(action), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-CK-Plugin-Id': 'task' },
        body: JSON.stringify(payload || {}),
      });
      let body = null;
      try { body = await res.json(); } catch (_) { /* 非 JSON 响应体：按状态码报错 */ }
      if (!res.ok) {
        const errors = (body && Array.isArray(body.errors) && body.errors) || ['HTTP ' + res.status];
        throw new Error(errors.join('; '));
      }
      return body;
    }
    function render(fs, values) {
      fields = fs || []; form.innerHTML = '';
      for (const f of fields) {
        const wrap = document.createElement('div'); wrap.className = 'row';
        const lab = document.createElement('label'); lab.textContent = f.label || f.key; wrap.appendChild(lab);
        let input;
        if (f.type === 'boolean') {
          input = document.createElement('input'); input.type = 'checkbox'; input.checked = isTrue(values[f.key]);
        } else {
          input = document.createElement('input');
          input.type = f.type === 'integer' ? 'number' : 'text';
          input.value = values[f.key] == null ? '' : String(values[f.key]);
          if (f.min != null) input.min = f.min;
          if (f.max != null) input.max = f.max;
          input.autocomplete = 'off';
        }
        input.id = 'f_' + f.key;
        wrap.appendChild(input); form.appendChild(wrap);
      }
    }
    function collect() {
      const res = {};
      for (const f of fields) {
        const el = document.getElementById('f_' + f.key);
        if (!el) continue;
        // 值原样交给插件校验（空 / 越界 → 明确错误，不在页面静默改值）。
        if (f.type === 'boolean') res[f.key] = el.checked ? 'true' : 'false';
        else res[f.key] = String(el.value || '').trim();
      }
      return res;
    }
    async function refresh() {
      try {
        const v = await rpc('status');
        document.getElementById('dims').textContent =
          '平台 ' + (v.goos || '-') + ' · shell ' + (v.shell || '默认') + ' · 超时 ' + v.defaultTimeoutSec +
          's · 输出上限 ' + v.maxOutputKB + 'KB · cwd ' + (v.defaultCwd || '会话 work_dir');
        out.hidden = false; out.textContent = JSON.stringify(v, null, 2);
      } catch (e) { show('读取失败: ' + e.message, true); }
    }
    async function load() {
      try {
        const r = await api('load');
        render(r.fields, r.values);
        await refresh();
      } catch (e) { show('加载失败: ' + e.message, true); }
    }
    document.getElementById('save').onclick = async () => {
      try { await api('save', { entries: collect() }); await load(); show('已保存。'); }
      catch (e) { show('保存失败: ' + e.message, true); }
    };
    document.getElementById('reset').onclick = async () => {
      try { await api('reset'); await load(); show('已恢复默认。'); }
      catch (e) { show('恢复失败: ' + e.message, true); }
    };
    document.getElementById('refresh').onclick = refresh;
    load();
  </script>
</body>
</html>
